# Prueba local del despliegue (PostgreSQL + API), igual que en el servidor:
#   docker compose up --build
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tomate_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tomate_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/tomate_db
      UPLOAD_DIR: /data/uploads
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
